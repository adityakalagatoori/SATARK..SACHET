# Local/staging orchestration for SACHET's production stack.
# Brings up the real infrastructure the code in this folder is written
# against (Kafka for event_bus.py's KafkaEventBus, Redis for
# feature_store.py's RedisFeatureStore) alongside the serving API.
# NOT for a hackathon demo — this is the environment production code
# actually needs, distinct from the zero-dependency in-memory backends
# used for local development and the tests in tests/.

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # durability for the online feature store

  sachet-api:
    build:
      context: ..
      dockerfile: production/Dockerfile
    depends_on:
      - kafka
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    volumes:
      - ./governance/_state:/app/production/governance/_state
      - ./serving/_state:/app/production/serving/_state

volumes:
  redis_data:
